<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>課程已結束｜企業AI知識化應用</title>
<style>
  /* 課程結束公告頁：奶油底、大字、單卡置中，桌機與手機皆可讀 */
  :root{--cream:#f7f1e6;--panel:#fffdf8;--ink:#2b2545;--muted:#6b647e;--line:#e6ddcb;--brand:#6b5bd6;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
       background:radial-gradient(circle at 50% 15%,#f3ecdd,#e3dccd 95%);color:var(--ink);
       min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:20px;
        box-shadow:0 22px 60px rgba(0,0,0,.14);max-width:620px;width:100%;padding:48px 44px;}
  .tag{display:inline-block;font-size:15px;font-weight:800;color:var(--brand);background:#efeaff;
       padding:7px 16px;border-radius:999px;letter-spacing:.5px;}
  h1{font-size:38px;font-weight:800;line-height:1.25;margin:20px 0 16px;}
  p{font-size:17px;line-height:1.75;color:#4a4463;margin-bottom:14px;}
  .hr{height:1px;background:var(--line);margin:28px 0 22px;}
  .foot{font-size:14px;color:var(--muted);line-height:1.7;}
  .foot b{color:var(--ink);}
  a{color:var(--brand);}
  @media(max-width:520px){.card{padding:34px 24px;}h1{font-size:29px;}}
</style>
</head>
<body>
  <main class="card">
    <span class="tag">課程已結束</span>
    <h1>企業AI知識化應用<br>四天課程　已圓滿結束</h1>
    <p>感謝各位學員的參與。本課程學員專區已於 <b>2026 年 9 月 2 日</b> 關閉，站上的簡報、實作教學與講義不再對外開放。</p>
    <p>若您是本次學員，需要課程教材電子檔，或想洽談企業內訓與 AI 導入服務，歡迎與我們聯繫。</p>
    <div class="hr"></div>
    <p class="foot">
      <b>ECOxSTRAT 全感生態策略</b><br>
      請洽原課程承辦窗口或講師取得後續協助。
    </p>
  </main>
</body>
</html>
